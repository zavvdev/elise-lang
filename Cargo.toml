# This toml file is called a Virtual Manifest because
# it defines a workspace rather than a package.

[workspace]
resolver = "2"

members = [
    "cli",
    "compiler",
    "frontend/binder",
    "frontend/data",
    "frontend/parser",
    "frontend/semanalyzer",
    "ir/aast",
    "ir/ast",
    "ir/bindings",
    "ir/bytecode",
    "runtime/vm",
    "shared/errors",
    "shared/types",
    "shared/proc_macros",
    "test-utils",
]

[workspace.dependencies]
colored = "3.1.1"
serial_test = "3.4.0"
rayon = "1.12.0"
csv = "1.4.0"
syn = "3.0.9"
quote = "1.0.47"
proc-macro2 = "1.0.107"
