[package]
name = "elise"
version = "0.1.0"
edition = "2024"

[[bin]]
# name = name of the compiled executable.
# The output binary will be: target/debug/elise
name = "elise"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
elise-frontend-data = { path = "../frontend/data" }
elise-frontend-parser = { path = "../frontend/parser" }
elise-frontend-semanalyzer = { path = "../frontend/semanalyzer" }
elise-ir-bindings = { path = "../ir/bindings" }
elise-shared-errors = { path = "../shared/errors" }
elise-shared-types = { path = "../shared/types" }
colored.workspace = true
serial_test.workspace = true
rayon.workspace = true
